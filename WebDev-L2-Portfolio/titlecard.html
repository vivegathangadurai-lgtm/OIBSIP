<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oasis Infobyte — Demo Title Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0B0F17;
    color: #FFFFFF;
    font-family: 'IBM Plex Sans', sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .title-card {
    width: 100%;
    max-width: 1280px;
    padding: 60px 80px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid #1E293B;
    border-radius: 12px;
    position: relative;
    box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
  }
  .badge {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #38BDF8;
    background: rgba(56, 189, 248, 0.12);
    padding: 8px 16px;
    border-radius: 4px;
    border: 1px solid rgba(56, 189, 248, 0.3);
    margin-bottom: 32px;
  }
  .project-title {
    font-size: 48px;
    font-weight: 700;
    line-height: 1.2;
    color: #FFFFFF;
    margin-bottom: 40px;
    letter-spacing: -0.01em;
  }
  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    border-top: 1px solid #1E293B;
    padding-top: 32px;
  }
  .meta-item .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #94A3B8;
    margin-bottom: 6px;
  }
  .meta-item .value { font-size: 22px; font-weight: 600; color: #F1F5F9; }
  .timer-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 6px;
    background: #38BDF8;
    width: 0%;
    animation: fillTimer 2s linear forwards;
  }
  @keyframes fillTimer { from { width: 0%; } to { width: 100%; } }
</style>
</head>
<body>
  <div class="title-card">
    <div class="badge">Oasis Infobyte Internship</div>
    <h1 class="project-title">Personal Portfolio Website</h1>
    <div class="meta-grid">
      <div class="meta-item">
        <div class="label">Full Name</div>
        <div class="value">Vivega Thangadurai</div>
      </div>
      <div class="meta-item">
        <div class="label">Assigned Track</div>
        <div class="value">Web Development (Level 1 - Task 2)</div>
      </div>
    </div>
    <div class="timer-bar"></div>
  </div>
</body>
</html>
